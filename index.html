<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lineup Studio — Escalações</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Oswald:wght@500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0c0f1a;--p:#141a2b;--b:#242c44;--t:#eaf0ff;--m:#8d99b8;--a:#3b6bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--bg:#eef1f8;--p:#fff;--b:#d3dae9;--t:#141a2b;--m:#5b6784;--a:#2a56e8}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;grid-template-columns:390px 1fr;overflow:hidden}
.side{background:var(--p);border-right:1px solid var(--b);display:flex;flex-direction:column;min-height:0}
.logo{padding:14px 16px;font:800 20px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase}.logo i{color:var(--a);font-style:normal}
nav{display:flex;border-bottom:1px solid var(--b);overflow-x:auto}nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--m);padding:10px 8px;font-weight:600;cursor:pointer;white-space:nowrap}nav button.on{color:var(--t);border-color:var(--a)}
#tab{padding:14px;overflow:auto;flex:1}
h4{margin:18px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--m)}h4:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--m);margin-bottom:10px}
input,select{width:100%;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:8px 10px;font:inherit;margin-top:4px}
input[type=color]{padding:2px;height:36px}input[type=range]{padding:0}input[type=checkbox]{width:auto;margin-right:8px}
button{font:inherit;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--a)}
button.on,button.pri{background:var(--a);border-color:var(--a);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr{border:1px solid var(--b);border-radius:10px;padding:8px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pr input,.pr select{margin:0;padding:6px 8px}.pr .n{width:52px}.pr .f{flex:1 1 80px;width:auto}
.th{width:40px;height:40px;border-radius:8px;background:var(--b);overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--m)}.th img{width:100%;height:100%;object-fit:cover}
.up{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--b);border-radius:8px;cursor:pointer}.up input{display:none}.up.ok{border-color:#2fbf71}
.pr select{flex:1 1 120px;width:auto;font-size:12px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--b);background:var(--p);align-items:center;flex-wrap:wrap}.sp{flex:1}
.view{flex:1;min-height:0;display:grid;place-items:center;background:repeating-conic-gradient(#0000 0 25%,#8883 0 50%) 0 0/20px 20px,#05070d;position:relative}
.frame{position:relative;overflow:hidden;box-shadow:0 20px 60px #000a}
.sm{font-size:12px;color:var(--m);margin:6px 0}#fsbar{display:none;position:absolute;left:50%;bottom:28px;transform:translateX(-50%);gap:10px;z-index:20;transition:opacity .4s}.view:fullscreen #fsbar{display:flex}#fsbar.off{opacity:0;pointer-events:none}#fsbar button{font-size:18px;padding:12px 24px;background:#000c;color:#fff;border-color:#fff5}#fsbar button.pri{background:var(--a);border-color:var(--a)}.view.noc,.view.noc *{cursor:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.on{opacity:1}
body.clean{grid-template-columns:1fr}body.clean .side,body.clean #bar{display:none}
@media(max-width:900px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto;height:auto}.side{max-height:55vh;order:2}.main{order:1;height:60vh}}
/* ===== PALCO ===== */
.stage{position:absolute;left:0;top:0;width:var(--W);height:var(--H);transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;color:#fff;font-family:var(--font),'Arial Narrow',sans-serif;
background:radial-gradient(1200px 800px at 85% 0,rgba(var(--prir),.38),transparent 60%),linear-gradient(160deg,var(--bg2),#000 170%)}
.stage.ibase{flex-direction:column-reverse}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 40px,transparent 40px 80px)}
.hd{position:relative;height:150px;flex:none;padding:0 56px;display:flex;align-items:center;gap:28px;background:linear-gradient(100deg,var(--pri) 62%,rgba(0,0,0,.4) 62.2%);border-bottom:5px solid var(--acc)}
.ibase .hd{border-bottom:0;border-top:5px solid var(--acc)}
.cr{height:104px;width:auto;max-width:130px;object-fit:contain}
.tt h1{margin:0;line-height:.92;font-weight:800;text-transform:uppercase;letter-spacing:.01em;color:var(--sec)}
.tt{min-width:0}.tt p{margin:6px 0 0;font-size:var(--sfs,28px);letter-spacing:.18em;text-transform:uppercase;opacity:.85;font-weight:500}
.fm{white-space:nowrap;flex:none;margin-left:auto;text-align:right;background:var(--acc);color:#000;padding:10px 30px;transform:skewX(-10deg)}.fm *{display:block;transform:skewX(10deg)}.fm small{font-size:18px;letter-spacing:.2em;font-weight:700}.fm b{font-size:var(--fmb,56px);line-height:1;font-weight:800}
.bd{position:relative;flex:1;min-height:0;display:flex;padding:32px 56px}.bd.rev{flex-direction:row-reverse}.bd.col{flex-direction:column;align-items:center}
.pc{flex:none;display:flex;align-items:center;justify-content:center}
.pitch{position:relative;border-radius:10px;box-shadow:0 14px 40px #0009;flex:none}.pitch svg{position:absolute;inset:0;width:100%;height:100%;border-radius:10px}
.pt{position:absolute;transform:translate(-50%,-50%);width:var(--mk);height:var(--mk);border-radius:50%;background:var(--pri);border:4px solid var(--sec);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--mk)*.5);cursor:grab;touch-action:none;box-shadow:0 4px 12px #0008;z-index:2}
.pt span{color:#fff;text-shadow:0 1px 3px #000;position:absolute;top:100%;margin-top:5px;white-space:nowrap;background:rgba(0,0,0,.75);padding:1px 10px;border-radius:4px;font-size:calc(var(--mk)*.42);font-weight:700;text-transform:uppercase;pointer-events:none}
.pt.hl{background:var(--acc);color:#000;transform:translate(-50%,-50%) scale(1.35);box-shadow:0 0 0 8px rgba(255,255,255,.25),0 0 34px var(--acc);z-index:4}
.cards{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}.rw{flex:1;min-height:0;display:flex;justify-content:center;gap:14px}.rw .card{flex:none;width:calc(var(--cwp)*var(--ps));height:calc(var(--ps)*100%)}.rw .card .nm{position:absolute;left:0;right:0;bottom:0;padding:46px 14px 12px;background:linear-gradient(0deg,rgba(0,0,0,.94) 0,rgba(0,0,0,.7) 55%,rgba(0,0,0,0));border-left:0;border-bottom:6px solid var(--acc)}.rw .card .ph img,.rw .card .ph video{object-position:50% 22%}
.card{position:relative;justify-self:center;align-self:center;width:calc(var(--ps)*100%);height:calc(var(--ps)*100%);display:flex;flex-direction:column;background:#0008;border-top:6px solid var(--pri);border-radius:6px;overflow:hidden;box-shadow:0 10px 26px #0007}
.ph{position:relative;flex:1;min-height:0;background:linear-gradient(165deg,var(--pri),#000 140%);overflow:hidden}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.ini{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--nof)*1.7);font-weight:800;opacity:.22}
.no{position:absolute;right:12px;top:2px;font-style:normal;font-weight:800;font-size:var(--nof);line-height:1.1;text-shadow:0 3px 14px #000c}
.nm{padding:8px 14px 10px;background:linear-gradient(90deg,rgba(0,0,0,.75),rgba(0,0,0,.5));border-left:6px solid var(--acc)}
.nm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:calc(var(--nmf)*.66);text-transform:uppercase;letter-spacing:.1em;opacity:.85;font-weight:500;min-height:1em}
.nm strong{display:block;font-size:var(--nmf);text-transform:uppercase;line-height:1.05;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm em{font-style:normal;font-size:calc(var(--nmf)*.6);color:var(--acc);font-weight:700;letter-spacing:.14em}
.spot{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5}.spot.on{display:flex}
.big{height:100%;aspect-ratio:3/4;max-width:100%;display:flex;flex-direction:column;border-top:8px solid var(--acc);background:#000a;animation:var(--anim) .7s backwards;border-radius:8px;overflow:hidden}
.big .no{font-size:calc(var(--nof)*2)}.big .nm strong{font-size:calc(var(--nmf)*1.7)}
.ft{position:relative;flex:none;padding:0 56px;display:flex;align-items:center;gap:24px;background:rgba(0,0,0,.45)}
.lb{font-size:34px;font-weight:800;letter-spacing:.15em;color:var(--acc);white-space:nowrap}.ft:not(.sm2) .lb{writing-mode:vertical-rl;transform:rotate(180deg);font-size:28px}
.chips{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0;align-items:center}.chrow{display:flex;gap:10px;justify-content:center;width:100%}.ft.sm2 .chips{width:100%;flex:none}.ft.sm2{flex-direction:column;align-items:flex-start;justify-content:center;gap:6px}.ft.sm2 .lb{font-size:26px}
.chip{width:var(--chw,300px);flex:none;display:flex;align-items:center;gap:10px;height:var(--chh,56px);padding-right:18px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;font-size:var(--chf,26px);text-transform:uppercase;font-weight:700}
.chip .ph{flex:none;width:var(--chh,56px);height:100%}.chip .ini{font-size:calc(var(--chh,56px)*.45)}.chip b{background:var(--pri);height:100%;min-width:var(--chh,56px);display:grid;place-items:center;font-size:calc(var(--chh,56px)*.55)}.chip span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip em{font-style:normal;color:var(--acc);font-size:20px}
.hid{opacity:0!important}
.card.in{animation:var(--anim) .65s cubic-bezier(.2,.8,.2,1) backwards}.pt.in{animation:a-pop .5s backwards}.chip.in{animation:a-slide .5s backwards}
.stage.intro .hd{animation:a-down .7s cubic-bezier(.2,.8,.2,1) backwards}.stage.intro .pitch{animation:a-fade .9s backwards}
@keyframes a-slide{from{opacity:0;transform:translateX(90px)}}@keyframes a-fade{from{opacity:0}}@keyframes a-zoom{from{opacity:0;transform:scale(.65)}}@keyframes a-rise{from{opacity:0;transform:translateY(90px)}}
@keyframes a-pop{from{opacity:0;transform:translate(-50%,-50%) scale(.2)}}@keyframes a-down{from{opacity:0;transform:translateY(-100%)}}
</style></head>
